[project]
name = "ai-job-counselor"
version = "1.0.0"
description = "AI Job Counselor — LangGraph agent for job analysis, skill gaps, and learning plans"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["config*", "models*", "agent*", "api*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
