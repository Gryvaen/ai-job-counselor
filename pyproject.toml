[project]
name = "ai-agent-interview-bot"
version = "0.1.0"
description = "AI Agent interview bot with resume context, multi-round technical probing, scoring, and coverage tracking"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0,<0.6.0",
    "tiktoken>=0.7.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["config*", "models*", "storage*", "rag*", "agent*", "crews*", "scripts*", "tests*", "api*"]
