[project]
name = "jobmatch-agent"
version = "0.1.0"
description = "JobMatch Agent — Boss Zhipin job scraping + RAG matching + resume optimization + Feishu notification"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0,<0.6.0",
    "tiktoken>=0.7.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
agents = [
    # Optional legacy CrewAI/MCP integrations. The current WebUI pipeline uses
    # rule-based crews and does not need these heavy dependencies at runtime.
    "crewai<0.12.0,>=0.10.0",
    "fastmcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["config*", "models*", "storage*", "scraper*", "rag*", "agent*", "crews*", "mcp_servers*", "notifier*", "scripts*", "tests*", "api*"]
