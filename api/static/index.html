<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>AI 求职顾问</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
              </svg>
            </div>
            <div class="brand-text">
              <strong>AI 求职顾问</strong>
              <small>Career Counselor</small>
            </div>
          </div>
          <button id="sidebarClose" class="icon-btn sidebar-close" aria-label="关闭侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-label">分析流程</p>
          <ol id="sidebarSteps" class="step-list">
            <li class="step-item" data-step="job_analyzer">
              <span class="step-badge">1</span>
              <div>
                <span class="step-name">岗位分析</span>
                <span class="step-desc">解读目标岗位</span>
              </div>
            </li>
            <li class="step-item" data-step="skill_gap_analyzer">
              <span class="step-badge">2</span>
              <div>
                <span class="step-name">技能缺口</span>
                <span class="step-desc">对比简历与 JD</span>
              </div>
            </li>
            <li class="step-item" data-step="learning_planner">
              <span class="step-badge">3</span>
              <div>
                <span class="step-name">学习路线</span>
                <span class="step-desc">制定提升计划</span>
              </div>
            </li>
            <li class="step-item" data-step="project_recommender">
              <span class="step-badge">4</span>
              <div>
                <span class="step-name">项目推荐</span>
                <span class="step-desc">实战项目建议</span>
              </div>
            </li>
          </ol>
        </nav>

        <div class="sidebar-footer">
          <div class="tech-stack">
            <span class="tag">LangGraph</span>
            <span class="tag">Ollama</span>
            <span class="tag">FastAPI</span>
          </div>
        </div>
      </aside>

      <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

      <!-- Main -->
      <main class="main">
        <header class="navbar">
          <button id="sidebarToggle" class="icon-btn" aria-label="打开侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12h18M3 6h18M3 18h18" />
            </svg>
          </button>

          <div class="navbar-center">
            <label id="modelField" class="model-selector hidden">
              <svg class="model-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
              </svg>
              <select name="model" id="modelSelect">
                <option value="">加载中...</option>
              </select>
            </label>
            <small id="modelHint" class="model-hint hidden"></small>
          </div>

          <div class="navbar-right">
            <div class="health-badge" id="healthBadge">
              <span id="healthDot" class="dot"></span>
              <span id="healthText">checking</span>
            </div>
          </div>
        </header>

        <div class="workspace">
          <section id="notice" class="notice hidden"></section>

          <!-- Welcome / Input -->
          <section id="inputSection" class="input-section">
            <div class="welcome">
              <h1>告诉我你的求职目标</h1>
              <p class="welcome-sub">输入目标岗位，可选附上简历与 JD，获取个性化分析与学习路线</p>
            </div>

            <form id="consultForm" class="consult-form">
              <div class="form-primary">
                <label class="field field-main">
                  <span class="field-label">目标岗位</span>
                  <input
                    name="user_query"
                    required
                    placeholder="例如：我想找 AI Agent 方向的实习岗位"
                    autocomplete="off"
                  />
                </label>
                <div class="form-actions">
                  <button id="submitBtn" type="submit" class="submit-btn">
                    <span class="btn-text">开始分析</span>
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                  </button>
                </div>
              </div>

              <details class="form-extra">
                <summary>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                  </svg>
                  补充简历与 JD（可选，提升分析精度）
                </summary>
                <div class="extra-fields">
                  <label class="field">
                    <span class="field-label">简历 / 技能</span>
                    <textarea
                      name="resume_text"
                      rows="4"
                      placeholder="Python, FastAPI, 做过 RAG 项目..."
                    ></textarea>
                  </label>
                  <label class="field">
                    <span class="field-label">岗位 JD</span>
                    <textarea
                      name="jd_text"
                      rows="4"
                      placeholder="粘贴 JD 可获得更精准的技能缺口分析"
                    ></textarea>
                  </label>
                </div>
              </details>
            </form>

            <div class="quick-tips">
              <button type="button" class="tip-chip" data-query="我想找 AI Agent 工程师实习">
                AI Agent 实习
              </button>
              <button type="button" class="tip-chip" data-query="后端开发工程师，熟悉 Python 和 Go">
                后端开发
              </button>
              <button type="button" class="tip-chip" data-query="大模型应用开发，有 RAG 项目经验">
                大模型应用
              </button>
            </div>
          </section>

          <!-- Pipeline (horizontal, shown during analysis) -->
          <section id="pipeline" class="pipeline-bar hidden">
            <div class="pipeline-inner">
              <div class="step" data-step="job_analyzer"><span class="step-icon">1</span>岗位分析</div>
              <div class="step-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
              </div>
              <div class="step" data-step="skill_gap_analyzer"><span class="step-icon">2</span>技能缺口</div>
              <div class="step-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
              </div>
              <div class="step" data-step="learning_planner"><span class="step-icon">3</span>学习路线</div>
              <div class="step-arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
              </div>
              <div class="step" data-step="project_recommender"><span class="step-icon">4</span>项目推荐</div>
            </div>
          </section>

          <!-- Results -->
          <section id="results" class="results hidden">
            <div class="results-header">
              <h2>分析结果</h2>
              <button id="newConsultBtn" type="button" class="ghost-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                新建分析
              </button>
            </div>

            <div class="results-body">
              <nav class="results-tabs" aria-label="分析结果分类">
                <button class="tab active" data-tab="job">岗位分析</button>
                <button class="tab" data-tab="gap">技能缺口</button>
                <button class="tab" data-tab="plan">学习路线</button>
                <button class="tab" data-tab="projects">项目推荐</button>
              </nav>

              <div class="results-panels">
                <article class="result-panel active" id="panelJob">
                  <div id="jobContent" class="panel-body"></div>
                </article>
                <article class="result-panel" id="panelGap">
                  <div id="gapContent" class="panel-body"></div>
                </article>
                <article class="result-panel" id="panelPlan">
                  <div id="planContent" class="panel-body"></div>
                </article>
                <article class="result-panel" id="panelProjects">
                  <div id="projectsContent" class="panel-body"></div>
                </article>
              </div>
            </div>

            <details class="json-panel">
              <summary>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 18l6-6-6-6M8 6l-6 6 6 6" />
                </svg>
                查看原始 JSON
              </summary>
              <pre id="jsonOutput"></pre>
            </details>
          </section>
        </div>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
