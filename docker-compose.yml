services:
  ollama:
    image: ollama/ollama:latest
    container_name: job-counselor-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-counselor-webui
    ports:
      - "${WEBUI_PORT:-8001}:8001"
    env_file:
      - .env
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
