services:
  ollama:
    image: ollama/ollama:latest
    container_name: jobmatch-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobmatch-webui
    ports:
      - "${WEBUI_PORT:-8000}:8000"
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434/v1
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./.env:/app/.env
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
